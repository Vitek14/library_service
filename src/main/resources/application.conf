ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
      com.example.HttpKt.configureHttp
      com.example.SerializationKt.configureSerialization
      com.example.utilities.auth.JWTServiceKt.configureSecurity
      com.example.StatusPagesKt.configureStatusPages
      com.example.RoutingKt.configureRouting
      com.example.db.DatabaseFactoryKt.configureDB
    ]
  }
}

security {
  jwt_secret = ${JWT_SECRET}
}

storage {
  driverClassName = "org.postgresql.Driver"
  jdbcUrl = ${JDBC_URL}
  user = ${DB_USER}
  password = ${DB_PASSWORD}
  maximumPoolSize = 10
}
