ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.example.MainKt.module
      - com.example.HttpKt.configureHttp
      - com.example.SerializationKt.configureSerialization
#      - com.example.SecurityKt.configureSecurity
#      - com.example.PostgresKt.configurePostgres
#      - com.example.RoutingKt.configureRouting

database:
  jdbcUrl: "$DB_JDBC_URL"
  user: "$DB_USER"
  password: "$DB_PASSWORD"
  maxPoolSize: "$DB_MAX_POOL_SIZE:10"

jwt:
  secret: "$JWT_SECRET"
  issuer: "$JWT_ISSUER:library-service"
  audience: "$JWT_AUDIENCE:library-users"
  realm: "$JWT_REALM:library"
  expirationMs: "$JWT_EXPIRATION_MS:3600000"

defaultAdmin:
  login: "$DEFAULT_ADMIN_LOGIN:admin"
  password: "$DEFAULT_ADMIN_PASSWORD"
  name: "$DEFAULT_ADMIN_NAME:Admin"
  surname: "$DEFAULT_ADMIN_SURNAME:Adminov"
